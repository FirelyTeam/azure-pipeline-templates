# Repo: FirelyTeam/azure-pipeline-templates
# File: push-nuget-package.yml

parameters:
  artifact:  # The name of the artifact to download
  source:    # NuGet Source, like https://nuget.pkg.github.com/FirelyTeam/index.json
  apiKey: '' # The api key to be used for pushing packages to the NuGet server. Passed via the NUGET_API_KEY environment variable so it never appears as a literal command-line argument (DEVOPS-903/DEVOPS-849).

steps:
- powershell: |
    if ($Env:AGENT_OS -eq "Windows_NT") {$sep = "\"} else {$sep = "/"}
    echo "##vso[task.setvariable variable=PATH_SEPARATOR]$sep"
- download: none
- task: DownloadPipelineArtifact@2
  inputs:
    source: current
    artifact: ${{ parameters.artifact }}
    path: $(Build.ArtifactStagingDirectory)$(PATH_SEPARATOR)${{ parameters.artifact }}
- task: NuGetToolInstaller@1
  inputs:
    versionSpec: 5.x
- task: DotNetCoreCLI@2
  displayName: Push packages to NuGet server
  env:
    NUGET_API_KEY: ${{ parameters.apiKey }} # read by dotnet nuget push (NuGet.Client 7.6+) when --api-key is omitted, keeping the secret out of the process command line
  inputs:
    command: custom
    custom: nuget
    arguments: >
      push $(Build.ArtifactStagingDirectory)$(PATH_SEPARATOR)${{ parameters.artifact }}$(PATH_SEPARATOR)*.nupkg
      --source ${{ parameters.source }}
      --skip-duplicate
