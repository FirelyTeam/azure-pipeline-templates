# Repo: FirelyTeam/azure-pipeline-templates
# File: push-nuget-package.yml

parameters:
  artifact:              # The name of the artifact to download
  source:                # NuGet Source, like https://nuget.pkg.github.com/FirelyTeam/index.json
  apiKey: ''             # The api key to be used for pushing packages to the NuGet server. Passed via the NUGET_API_KEY environment variable so it never appears as a literal command-line argument (DEVOPS-903/DEVOPS-849).
  dotnetVersion: '10.x'  # .NET SDK version used to run the push, pinned independently of the consumer's own SDK/global.json. Must bundle NuGet.Client >= 7.6 (the version that added NUGET_API_KEY environment variable support).

steps:
- powershell: |
    if ($Env:AGENT_OS -eq "Windows_NT") {$sep = "\"} else {$sep = "/"}
    echo "##vso[task.setvariable variable=PATH_SEPARATOR]$sep"
- download: none
- task: DownloadPipelineArtifact@2
  inputs:
    source: current
    artifact: ${{ parameters.artifact }}
    path: $(Build.ArtifactStagingDirectory)$(PATH_SEPARATOR)${{ parameters.artifact }}
- task: UseDotNet@2
  displayName: Use pinned .NET SDK for NuGet push
  inputs:
    packageType: sdk
    version: ${{ parameters.dotnetVersion }}
    # useGlobalJson is intentionally left at its default (false): a global.json in the consumer's
    # repo must not be able to redirect this step to an older SDK/NuGet client that doesn't
    # support NUGET_API_KEY (see below).
- task: DotNetCoreCLI@2
  displayName: Push packages to NuGet server
  env:
    NUGET_API_KEY: ${{ parameters.apiKey }} # read by dotnet nuget push (NuGet.Client 7.6+) when --api-key is omitted, keeping the secret out of the process command line
  inputs:
    command: custom
    custom: nuget
    # Run from the downloaded-artifact folder, not the default source checkout root, so that any
    # global.json committed in the consumer's repo cannot override the SDK pinned above for this step.
    workingDirectory: $(Build.ArtifactStagingDirectory)$(PATH_SEPARATOR)${{ parameters.artifact }}
    arguments: >
      push *.nupkg
      --source ${{ parameters.source }}
      --skip-duplicate
