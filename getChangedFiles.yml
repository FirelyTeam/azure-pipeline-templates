# Repo: FirelyTeam/azure-pipeline-templates
# File: getChangedFiles.yml
#
# Reusable step that computes the list of changed files for the current build - diffing against the
# PR target branch, or HEAD~1 for a plain branch build - and writes it to a file (one path per
# line). Only the file's path is exposed, as the `changedFilesPath` output variable: a large diff
# (e.g. a release merge) stored as a variable becomes an environment variable over Linux's 128 KB
# limit, and every later step in the job then fails with "Argument list too long".
# The file lives in Agent.TempDirectory, which is cleaned after every job, so changedFilesPath
# only works for steps in the same job.
# Shared by check-skip-stage.yml and checkRequiredFileChanges.yml so the PR-vs-branch-build
# diffing logic lives in exactly one place. Requires a preceding
# `checkout: self` with `fetchDepth: 0` in the same job (a shallow clone can't diff against the
# target branch or HEAD~1).
#
# Usage (within a job's steps):
#   - template: getChangedFiles.yml
#     parameters:
#       name: getChangedFiles
#
#   - powershell: |
#       $changedFiles = @(Get-Content -LiteralPath "$(getChangedFiles.changedFilesPath)" -Encoding UTF8 | Where-Object { $_ })

parameters:
- name: name
  type: string
  default: 'getChangedFiles'
  displayName: 'Step name, used to reference the changedFilesPath output variable'

steps:
- powershell: |
    if ($env:BUILD_REASON -eq 'PullRequest') {
      # SYSTEM_PULLREQUEST_TARGETBRANCHNAME is the bare branch name (e.g. 'develop'), whereas
      # SYSTEM_PULLREQUEST_TARGETBRANCH is the full ref which would yield an invalid
      # 'origin/refs/heads/develop' ref.
      Write-Host "PR build: diffing against origin/$env:SYSTEM_PULLREQUEST_TARGETBRANCHNAME"
      $changedFiles = @(git diff --name-only "origin/$env:SYSTEM_PULLREQUEST_TARGETBRANCHNAME" | Where-Object { $_ })
    }
    else {
      Write-Host "Branch build: diffing HEAD~1..HEAD"
      $changedFiles = @(git diff --name-only HEAD~1 HEAD | Where-Object { $_ })
    }

    Write-Host "##[group]Changed files"
    # The agent runs logging commands found anywhere in a line, so break up '##vso[' in file names.
    $changedFiles | ForEach-Object { Write-Host ($_ -replace '##vso\[', '##vso_[') }
    Write-Host "##[endgroup]"

    $path = Join-Path $env:AGENT_TEMPDIRECTORY 'changedFiles-${{ parameters.name }}.txt'
    [System.IO.File]::WriteAllLines($path, [string[]]$changedFiles)
    Write-Host "Wrote $($changedFiles.Count) changed file(s) to $path"
    Write-Host "##vso[task.setvariable variable=changedFilesPath;isOutput=true]$path"
  name: ${{ parameters.name }}
  displayName: 'Get changed files'
